name: Release & Deployment

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Semantic Release & Docker Image
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/obsidian?schema=public"
          JWT_SECRET: "ci-secret-jwt-key-2026"
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npx prisma generate
          npx tsc --noEmit
          npm run build

      - name: Determine Next Semantic Version Tag
        id: versioning
        run: |
          # Default base version
          BASE_VERSION="1.0"
          RUN_NUM="${{ github.run_number }}"
          RELEASE_TAG="v${BASE_VERSION}.${RUN_NUM}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version: ${RELEASE_TAG}"

      - name: Create GitHub Release Tag
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: Release ${{ steps.versioning.outputs.release_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.versioning.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: Trigger PaaS Deploy Webhook (e.g. Railway / Render)
      - name: Trigger PaaS Deployment Webhook
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_WEBHOOK_URL"

